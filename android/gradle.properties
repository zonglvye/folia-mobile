# Folia Mobile shell — Gradle properties.
# file.encoding is pinned to UTF-8 because the project path and the app's own strings
# contain non-ASCII characters, and javac/aapt2 default to the platform codepage otherwise.
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false
# The workspace path contains non-ASCII characters ("开发"), which AGP refuses by default with
# StopExecutionException. Everything here is UTF-8 clean (see org.gradle.jvmargs above); this
# disables only the guard. If aapt2/javac ever misbehave on a resource path, move the project
# to an ASCII-only directory instead of fighting it.
android.overridePathCheck=true
